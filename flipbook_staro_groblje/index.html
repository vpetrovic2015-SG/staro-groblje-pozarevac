<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poznate ličnosti sahranjene na Starom groblju u Požarevcu</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#73563a,#20170f);color:#f5e7d1;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:14px 10px 4px;letter-spacing:.04em;font-size:clamp(17px,2vw,25px)}.credit{text-align:center;font-size:13px;opacity:.88;padding-bottom:8px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 14px 75px}.book{display:flex;align-items:stretch;filter:drop-shadow(0 18px 25px #0009)}
.sheet{height:min(76vh,calc(47vw * 1.414));aspect-ratio:1/1.414;background:#ead9bb;overflow:hidden}.sheet img{width:100%;height:100%;object-fit:contain;display:block}.left{border-radius:4px 0 0 4px;box-shadow:inset -12px 0 16px -18px #321}.right{border-radius:0 4px 4px 0;box-shadow:inset 12px 0 16px -18px #321}.single{border-radius:4px}.gutter{width:10px;background:linear-gradient(90deg,#53371e,#c8a477 50%,#53371e)}
button{position:fixed;bottom:18px;border:1px solid #e2c18b;background:linear-gradient(#f4dfb9,#c89b5c);color:#392512;border-radius:50%;width:58px;height:58px;font-size:32px;cursor:pointer;box-shadow:0 4px 12px #0008}button:disabled{opacity:.35;cursor:default}#prev{left:20px}#next{right:20px}#counter{position:fixed;bottom:37px;left:50%;transform:translateX(-50%);font-size:13px}
@media(max-width:700px){#stage{padding-bottom:90px}.sheet{height:min(70vh,calc(94vw * 1.414))}.gutter{display:none}#prev{left:10px}#next{right:10px}}
</style></head><body><header>ПОЗНАТЕ ЛИЧНОСТИ САХРАЊЕНЕ НА СТАРОМ ГРОБЉУ У ПОЖАРЕВЦУ</header><div class="credit">мр Владимир Петровић</div><div id="stage"><div class="book" id="book"></div></div><div id="counter"></div><button id="prev" aria-label="Prethodne strane">‹</button><button id="next" aria-label="Sledeće strane">›</button>
<script>
const total=30;let page=0;const book=document.getElementById('book'),counter=document.getElementById('counter');const mobile=()=>matchMedia('(max-width:700px)').matches;
function sheet(n,cls){let d=document.createElement('div');d.className='sheet '+cls;let im=document.createElement('img');im.src='pages/page-'+String(n).padStart(2,'0')+'.jpg';im.alt='Strana '+n;d.appendChild(im);return d}
function render(){book.innerHTML='';if(mobile()){book.appendChild(sheet(page+1,'single'));counter.textContent=`Strana ${page+1} / ${total}`}else if(page===0){book.appendChild(sheet(1,'single'));counter.textContent=`Strana 1 / ${total}`}else{book.appendChild(sheet(page,'left'));let g=document.createElement('div');g.className='gutter';book.appendChild(g);if(page+1<=total)book.appendChild(sheet(page+1,'right'));counter.textContent=`Strane ${page}–${Math.min(page+1,total)} / ${total}`}
document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=total-1}
function next(){if(page<total-1){page=mobile()?page+1:(page===0?1:Math.min(page+2,total-1));if(page>0&&page%2===0)page=Math.min(page+1,total-1);render()}}
function prev(){if(page>0){page=mobile()?page-1:(page<=1?0:Math.max(1,page-2));if(page>0&&page%2===0)page--;render()}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});let sx=null;book.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{if(sx!==null&&Math.abs(e.changedTouches[0].clientX-sx)>45)(e.changedTouches[0].clientX<sx?next:prev)();sx=null},{passive:true});window.addEventListener('resize',render);render();
</script></body></html>
